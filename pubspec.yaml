name: settle_up
description: "Offline-first expense splitting"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  app_settings: ^9.0.1
  bluetooth_low_energy: ^6.2.1
  bonsoir: ">=7.1.5 <7.1.6"          # see 2.1: dbus conflict
  characters: ^1.4.0
  collection: ^1.19.1
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  device_info_plus: ^13.3.0
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  google_fonts: ^9.0.0
  intl: ^0.20.2
  meta: ^1.18.3
  mobile_scanner: ^7.5.0
  nearby_connections: ^4.3.0
  network_info_plus: ">=8.2.1 <8.2.2"  # see 2.1: dbus conflict
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  sqlite3: ^3.9.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
